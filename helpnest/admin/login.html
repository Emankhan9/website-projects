<!DOCTYPE html>
<html lang="en">
<head>
<script>window.HN_ROOT="../";window.HN_PAGE="admin/login.html";</script>
<script src="../js/static-demo.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | HelpNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --brown: #5B4636; --cream: #F8F4E3; --green: #7C9473; --light-green: #A8BFA1; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
    body { min-height: 100vh; background: linear-gradient(135deg, #5B4636, #7a5c47); display: flex; justify-content: center; align-items: center; padding: 2rem; }
    .login-wrapper { display: flex; width: 100%; max-width: 900px; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .login-left { flex: 1; background: linear-gradient(135deg, #5B4636, #7a5c47); padding: 3rem 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .login-left .logo { font-family: "Playfair Display", serif; font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
    .login-left .logo span { color: var(--light-green); }
    .login-left .admin-badge { background: rgba(168,191,161,0.2); color: var(--light-green); border: 1px solid rgba(168,191,161,0.4); padding: 5px 16px; border-radius: 50px; font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2rem; }
    .login-left i.main-icon { font-size: 4rem; color: rgba(255,255,255,0.15); margin-bottom: 1.5rem; }
    .login-left h2 { font-family: "Playfair Display", serif; color: #fff; font-size: 1.5rem; margin-bottom: 0.8rem; }
    .login-left p { color: rgba(255,255,255,0.6); font-size: 0.85rem; line-height: 1.7; }
    .login-right { flex: 1; padding: 3rem 2.5rem; display: flex; flex-direction: column; justify-content: center; }
    .login-right h2 { font-family: "Playfair Display", serif; color: var(--brown); font-size: 1.8rem; margin-bottom: 0.4rem; }
    .login-right p.sub { color: #999; font-size: 0.85rem; margin-bottom: 2rem; }
    .error-msg { background: #fde8e8; color: #c0392b; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--brown); margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .input-wrap i.field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #bbb; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 12px 42px 12px 38px; border: 1.5px solid #e8e0d5; border-radius: 10px; font-family: "Poppins", sans-serif; font-size: 0.9rem; background: #fdfaf5; color: #333; transition: 0.2s; }
    .form-group input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(124,148,115,0.15); background: #fff; }
    .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #bbb; font-size: 0.88rem; background: none; border: none; padding: 0; transition: color 0.2s; }
    .toggle-pw:hover { color: var(--green); }
    .forgot-link { text-align: right; margin-top: 6px; }
    .forgot-link a { font-size: 0.78rem; color: var(--green); text-decoration: none; font-weight: 600; }
    .forgot-link a:hover { text-decoration: underline; }
    .login-btn { width: 100%; background: linear-gradient(135deg, var(--brown), #7a5c47); color: #fff; border: none; padding: 13px; border-radius: 12px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 0.5rem; }
    .login-btn:hover { background: linear-gradient(135deg, var(--green), #5a7a52); transform: translateY(-2px); }
    .back-link { text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: #999; }
    .back-link a { color: var(--green); text-decoration: none; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
    @media (max-width: 650px) { .login-left { display: none; } .login-right { padding: 2rem 1.5rem; } }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-left">
    <div class="logo">Help<span>Nest</span></div>
    <div class="admin-badge">Admin Panel</div>
    <i class="fa-solid fa-gauge main-icon"></i>
    <h2>Control Center</h2>
    <p>Manage users, housekeepers, bookings, and contact messages — all in one place.</p>
  </div>
  <div class="login-right">
    <h2>Welcome Back</h2>
    <p class="sub">Sign in to access the admin dashboard</p>
        <form method="POST" autocomplete="off">
      <input type="hidden" name="csrf_token" value="static-demo-token">      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope field-icon"></i>
          <input type="email" name="email" placeholder="admin@helpnest.com" required autocomplete="off">
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" name="password" id="passwordField" placeholder="Enter password" required autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePassword()">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div class="forgot-link">
          <a href="admin_forgot_password.html"><i class="fa-solid fa-key"></i> Forgot Password?</a>
        </div>
      </div>
      <button type="submit" class="login-btn">
        <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
      </button>
    </form>
    <div class="back-link">
      <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
    </div>
  </div>
</div>
<script>
function togglePassword() {
    const field = document.getElementById('passwordField');
    const icon  = document.getElementById('eyeIcon');
    field.type     = field.type === 'password' ? 'text' : 'password';
    icon.className = field.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
}
</script>
</body>
</html>
