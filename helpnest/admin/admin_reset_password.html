<!DOCTYPE html>
<html lang="en">
<head>
<script>window.HN_ROOT="../";window.HN_PAGE="admin/admin_reset_password.html";</script>
<script src="../js/static-demo.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Reset Password — HelpNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --brown: #5B4636; --brown-dark: #3d2e22; --green: #7C9473; --light-green: #A8BFA1; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
    body { min-height: 100vh; background: linear-gradient(135deg, #5B4636, #7a5c47); display: flex; justify-content: center; align-items: center; padding: 2rem; }
    .wrapper { display: flex; width: 100%; max-width: 900px; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: fadeUp 0.6s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    /* LEFT */
    .login-left { flex: 1; background: linear-gradient(135deg, #5B4636, #7a5c47); padding: 3rem 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .logo { font-family: "Playfair Display", serif; font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
    .logo span { color: var(--light-green); }
    .admin-badge { background: rgba(168,191,161,0.2); color: var(--light-green); border: 1px solid rgba(168,191,161,0.4); padding: 5px 16px; border-radius: 50px; font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2rem; }
    .login-left .main-icon { font-size: 3.5rem; color: rgba(255,255,255,0.15); margin-bottom: 1.5rem; }
    .login-left h2 { font-family: "Playfair Display", serif; color: #fff; font-size: 1.5rem; margin-bottom: 0.8rem; }
    .login-left p { color: rgba(255,255,255,0.6); font-size: 0.85rem; line-height: 1.7; }
    .pw-rules { margin-top: 1.8rem; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .pw-rule { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: rgba(255,255,255,0.65); }
    .pw-rule i { width: 24px; height: 24px; border-radius: 6px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--light-green); flex-shrink: 0; }

    /* RIGHT */
    .login-right { flex: 1; padding: 3rem 2.5rem; display: flex; flex-direction: column; justify-content: center; }
    .login-right h2 { font-family: "Playfair Display", serif; color: var(--brown); font-size: 1.8rem; margin-bottom: 0.4rem; }
    .login-right p.sub { color: #999; font-size: 0.85rem; margin-bottom: 2rem; }

    .alert { padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .alert-error   { background: #fde8e8; color: #c0392b; animation: shake 0.4s ease; }
    .alert-success { background: #eef7ee; color: #27ae60; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--brown); margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .input-wrap i.icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #bbb; font-size: 0.9rem; transition: color 0.2s; }
    .input-wrap input { width: 100%; padding: 12px 42px 12px 38px; border: 1.5px solid #e8e0d5; border-radius: 10px; font-family: "Poppins", sans-serif; font-size: 0.9rem; background: #fdfaf5; color: #333; transition: 0.2s; }
    .input-wrap input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(124,148,115,0.15); background: #fff; }
    .input-wrap:focus-within i.icon { color: var(--green); }
    .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #bbb; font-size: 0.88rem; background: none; border: none; padding: 0; transition: color 0.2s; }
    .toggle-pw:hover { color: var(--green); }

    .strength-bar { height: 4px; border-radius: 4px; background: #f0ebe0; margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; width: 0%; border-radius: 4px; transition: all 0.4s; }
    .strength-text { font-size: 0.74rem; margin-top: 4px; color: #bbb; }

    .submit-btn { width: 100%; background: linear-gradient(135deg, var(--brown), #7a5c47); color: #fff; border: none; padding: 13px; border-radius: 12px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 0.5rem; }
    .submit-btn:hover { background: linear-gradient(135deg, var(--green), #5a7a52); transform: translateY(-2px); }

    /* Success */
    .success-card { text-align: center; padding: 1rem; }
    .success-card .check { width: 70px; height: 70px; background: #eef7ee; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem; }
    .success-card .check i { font-size: 2rem; color: #27ae60; }
    .success-card h3 { font-family: "Playfair Display", serif; font-size: 1.5rem; color: var(--brown); margin-bottom: 0.5rem; }
    .success-card p { color: #999; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .login-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, var(--brown), #7a5c47); color: #fff; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; }
    .login-btn:hover { background: linear-gradient(135deg, var(--green), #5a7a52); transform: translateY(-2px); }

    .back-link { text-align: center; margin-top: 1rem; font-size: 0.78rem; }
    .back-link a { color: #bbb; text-decoration: none; }
    .back-link a:hover { color: var(--brown); }

    @media (max-width: 650px) { .login-left { display: none; } .login-right { padding: 2rem 1.5rem; } }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="login-left">
    <div class="logo">Help<span>Nest</span></div>
    <div class="admin-badge">Admin Panel</div>
    <i class="fa-solid fa-key main-icon"></i>
    <h2>Create a New Password</h2>
    <p>Choose a strong password for your admin account.</p>
    <div class="pw-rules">
      <div class="pw-rule"><i class="fa-solid fa-check"></i> At least 8 characters</div>
      <div class="pw-rule"><i class="fa-solid fa-check"></i> One uppercase letter (A–Z)</div>
      <div class="pw-rule"><i class="fa-solid fa-check"></i> One number (0–9)</div>
      <div class="pw-rule"><i class="fa-solid fa-check"></i> Both passwords must match</div>
    </div>
  </div>

  <div class="login-right">
        <h2>New Password</h2>
    <p class="sub">Set a strong new password for your admin account</p>

    
    <form method="POST" autocomplete="off">
      <input type="hidden" name="csrf_token" value="static-demo-token">

      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock icon"></i>
          <input type="password" name="new_password" id="newPass"
                 placeholder="Enter new password" maxlength="200" required
                 oninput="checkStrength(this.value)" autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('newPass','eye1')">
            <i class="fa-solid fa-eye" id="eye1"></i>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-text" id="strengthText"></div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock icon"></i>
          <input type="password" name="confirm_password" id="confirmPass"
                 placeholder="Re-enter new password" maxlength="200" required
                 autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('confirmPass','eye2')">
            <i class="fa-solid fa-eye" id="eye2"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <i class="fa-solid fa-key"></i> Reset Password
      </button>
    </form>

    <div class="back-link">
      <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Admin Login</a>
    </div>
      </div>
</div>

<script>
function togglePw(fieldId, iconId) {
    const f = document.getElementById(fieldId);
    const i = document.getElementById(iconId);
    f.type = f.type === 'password' ? 'text' : 'password';
    i.className = f.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
}
function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    let score = 0;
    if (val.length >= 8)          score++;
    if (/[A-Z]/.test(val))        score++;
    if (/[0-9]/.test(val))        score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
        { pct:'0%',   color:'#f0ebe0', label:'' },
        { pct:'25%',  color:'#e74c3c', label:'Weak' },
        { pct:'50%',  color:'#e67e22', label:'Fair' },
        { pct:'75%',  color:'#f1c40f', label:'Good' },
        { pct:'100%', color:'#27ae60', label:'Strong' },
    ];
    fill.style.width      = levels[score].pct;
    fill.style.background = levels[score].color;
    text.textContent      = levels[score].label;
    text.style.color      = levels[score].color;
}
</script>
</body>
</html>
